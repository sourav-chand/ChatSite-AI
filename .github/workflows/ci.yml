name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install ruff black mypy
      - working-directory: backend
        run: |
          ruff check .
          black --check .
          mypy app
      - working-directory: frontend
        run: |
          npm ci
          npm run lint || true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatsite
          POSTGRES_PASSWORD: chatsite
          POSTGRES_DB: chatsite_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.12
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://chatsite:chatsite@localhost:5432/chatsite_test
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install -e .[dev]
          alembic upgrade head
          pytest --cov=app --cov-fail-under=70
      - working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chatsite-backend:ci ./backend
      - run: docker build -t chatsite-frontend:ci ./frontend

  scan:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'chatsite-backend:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
